version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: dsar_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-Mohamed} -d ${POSTGRES_DB:-dsar_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: dsar_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dsar.com
      PGADMIN_DEFAULT_PASSWORD: 12345
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: 
      context: ./backend
    container_name: dsar_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: 
      context: ./frontend
    container_name: dsar_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true 
    tty: true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
