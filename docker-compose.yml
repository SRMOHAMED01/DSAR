services:
  db:
    image: postgres:15-alpine
    container_name: dsar_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: dsar_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dsar.com
      PGADMIN_DEFAULT_PASSWORD: 12345
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build: 
      context: ./backend  # AJOUTE CETTE LIGNE
    container_name: dsar_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend # AJOUTE CETTE LIGNE
    container_name: dsar_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true 
    tty: true

volumes:
  postgres_data: